<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0755a2">
  <meta name="description" content="Tap&Connect — tap to leave a review and connect with us.">
  <title>Tap&Connect | NFC Review Card</title>
  <style>
    :root {
      --navy: #092b5d;
      --blue: #0755a2;
      --bright-blue: #1689df;
      --pale-blue: #eaf6ff;
      --text: #102b52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #f8fcff 0%, #e4f3ff 100%);
    }
    .page { width: 100%; max-width: 480px; }
    .panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 32px 24px 36px;
      border: 1px solid rgba(23, 129, 210, .16);
      border-radius: 30px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 22px 60px rgba(8, 61, 115, .14);
    }
    .panel::before, .panel::after {
      content: ""; position: absolute; z-index: -1; pointer-events: none;
    }
    .panel::before {
      width: 75%; height: 82px; top: -43px; left: -35px;
      background: linear-gradient(110deg, #06488e, #0877cf);
      border-radius: 0 0 65% 0; transform: rotate(-5deg);
    }
    .panel::after {
      width: 125%; height: 118px; bottom: -80px; left: -10%;
      background: linear-gradient(110deg, #b9e4ff 0%, #168ee1 55%, #06488e 100%);
      border-radius: 50% 50% 0 0; transform: rotate(-5deg);
    }
    .logo-wrap { width: 100%; margin: 12px auto 22px; text-align: center; }
    .logo { display: block; width: 100%; max-width: 420px; height: auto; margin: auto; mix-blend-mode: multiply; }
    .eyebrow {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 0 0 24px; color: var(--navy); font-size: 13px; font-weight: 850;
      letter-spacing: 4px; text-align: center;
    }
    .eyebrow::before, .eyebrow::after { content: ""; width: 38px; height: 2px; background: #258bd4; }
    h1 {
      margin: 0; color: var(--navy); text-align: center;
      font-size: clamp(38px, 10vw, 54px); line-height: 1.04;
      letter-spacing: -2px; font-weight: 850;
    }
    .intro { margin: 18px auto 34px; max-width: 340px; text-align: center; color: #19365f; font-size: 17px; line-height: 1.5; }
    .intro strong { position: relative; white-space: nowrap; }
    .intro strong::after { content: ""; position: absolute; height: 5px; width: 95%; left: 5%; bottom: -7px; border-top: 4px solid #35a5ed; border-radius: 50%; transform: rotate(-4deg); }
    .links { display: grid; gap: 16px; }
    .link-card {
      min-height: 94px; display: flex; align-items: center; gap: 18px;
      padding: 15px 18px; border: 1.5px solid #a8d5f8; border-radius: 28px;
      color: var(--text); text-decoration: none; background: #fff;
      box-shadow: 0 9px 18px rgba(6, 70, 130, .10);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .link-card:hover { transform: translateY(-2px); box-shadow: 0 13px 24px rgba(6,70,130,.16); }
    .link-card:active { transform: scale(.985); }
    .platform-icon { width: 62px; height: 62px; flex: 0 0 62px; display: grid; place-items: center; }
    .platform-icon svg { width: 58px; height: 58px; display: block; }
    .separator { width: 1.5px; height: 58px; background: #8bb9df; flex: 0 0 1.5px; }
    .copy { min-width: 0; flex: 1; }
    .copy small { display: block; font-size: 14px; font-weight: 650; line-height: 1.25; }
    .copy strong { display: block; margin-top: 2px; font-size: 22px; font-weight: 850; line-height: 1.15; }
    .chevron { color: #31577e; font-size: 34px; line-height: 1; font-weight: 300; padding: 0 2px 4px 0; }
    .thanks { margin: 27px 8px 8px; color: #526b88; text-align: center; font-size: 13px; line-height: 1.5; }
    .footer { margin: 18px 0 0; color: #6c8eae; text-align: center; font-size: 10px; letter-spacing: 2px; font-weight: 750; }
    .link-card:focus-visible { outline: 3px solid #1689df; outline-offset: 4px; }
    @media (max-width: 380px) {
      .panel { padding: 27px 16px 32px; border-radius: 24px; }
      .link-card { min-height: 82px; gap: 12px; padding: 12px; border-radius: 23px; }
      .platform-icon { width: 50px; height: 50px; flex-basis: 50px; }
      .platform-icon svg { width: 48px; height: 48px; }
      .separator { height: 50px; }
      .copy small { font-size: 12px; }
      .copy strong { font-size: 19px; }
      .chevron { font-size: 29px; }
      .eyebrow { letter-spacing: 2.5px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel" aria-labelledby="headline">
      <div class="logo-wrap">
        <img class="logo" src="assets/tap-connect-logo.png" alt="Tap&Connect logo">
      </div>
      <p class="eyebrow">NFC REVIEW CARD</p>
      <h1 id="headline">Tap to Leave<br>a Review</h1>
      <p class="intro">Your feedback helps us <strong>grow!</strong></p>

      <nav class="links" aria-label="Review and social media links">
        <a class="link-card" id="google-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Review us on Google">
          <span class="platform-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>
          </span>
          <span class="separator" aria-hidden="true"></span>
          <span class="copy"><small>Review us on</small><strong>Google</strong></span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
        <a class="link-card" id="facebook-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Find us on Facebook">
          <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#1877F2"/><path fill="#fff" d="M27.4 42V26.1h5.3l.8-6.2h-6.1v-4c0-1.8.5-3.1 3.1-3.1h3.3V7.3c-.6-.1-2.6-.3-4.9-.3-4.9 0-8.2 3-8.2 8.5v4.4h-5.5v6.2h5.5V42h6.7Z"/></svg></span>
          <span class="separator" aria-hidden="true"></span>
          <span class="copy"><small>Find us on</small><strong>Facebook</strong></span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
        <a class="link-card" id="instagram-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
          <span class="platform-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffca45"/><stop offset=".48" stop-color="#e1306c"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="13" fill="url(#ig)"/><rect x="11" y="11" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="24" cy="24" r="6.3" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="32.2" cy="15.8" r="2" fill="#fff"/></svg></span>
          <span class="separator" aria-hidden="true"></span>
          <span class="copy"><small>Follow us on</small><strong>Instagram</strong></span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
      </nav>
      <p class="thanks">Thank you for supporting us. We appreciate your time and every review!</p>
    </section>
    <p class="footer">POWERED BY TAP&CONNECT</p>
  </main>

  <script>
    // Add your destination URLs between the quotation marks below.
    // Example: google: "https://g.page/r/your-review-link"
    const SOCIAL_LINKS = {
      google: "",
      facebook: "",
      instagram: ""
    };

    const linkMap = {
      "google-link": SOCIAL_LINKS.google,
      "facebook-link": SOCIAL_LINKS.facebook,
      "instagram-link": SOCIAL_LINKS.instagram
    };

    Object.entries(linkMap).forEach(([id, url]) => {
      const link = document.getElementById(id);
      if (url && url.trim()) {
        link.href = url.trim();
      } else {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          alert("This link has not been added yet. Please add the URL in the SOCIAL_LINKS section of index.html.");
        });
      }
    });
  </script>
</body>
</html>
